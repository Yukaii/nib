name: verify

"on":
  push:
    branches: [main]
  pull_request:

# The workflow only checks code out and runs the build; it needs nothing else.
permissions:
  contents: read

# A new push on the same branch supersedes the previous run.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-26
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Select newest Xcode
        # Newest stable Xcode on the image, not the image default: the apps
        # track the current SDK. Version sort so 16.10 beats 16.4; no betas.
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: Packages/NibCore/.build
          key: ${{ runner.os }}-spm-${{ hashFiles('Packages/NibCore/Package.resolved', 'Packages/NibCore/Package.swift', 'Packages/NibCore/Sources/**/*.swift', 'Packages/NibCore/Tests/**/*.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Run verify
        run: scripts/verify.sh
